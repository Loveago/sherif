<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mark-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c15" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="mark-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Dynamic Pulse C-Arc -->
    <linearGradient id="mark-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Central Lightning Beam -->
    <linearGradient id="mark-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="mark-inner-light" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#mark-bg-grad)" stroke="url(#mark-rim)" stroke-width="3" />
  
  <!-- Subtle inner ambient glow -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#mark-inner-light)" />

  <!-- Background Data Flow Wavelets -->
  <path d="M30 84C38 84 46 88 56 88" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" />
  <path d="M30 94C42 94 52 98 64 98" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" />

  <!-- Outer Stylized "C" Data Packet Arc -->
  <path d="M88 34H48C38.059 34 30 42.059 30 52V76C30 85.941 38.059 94 48 94H88" 
        fill="none" 
        stroke="url(#mark-arc)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing High-Speed Lightning Data Surge -->
  <path d="M72 22L40 64H62L52 104L92 56H68L78 22H72Z" 
        fill="url(#mark-bolt)" 
        filter="url(#mark-glow)" />

  <!-- Tri-Carrier Digital Nodes (MTN Gold, Telecel Flame, Data Cyan/Emerald) -->
  <circle cx="92" cy="34" r="6" fill="#f59e0b" />
  <circle cx="92" cy="34" r="3" fill="#ffffff" />

  <circle cx="92" cy="94" r="6" fill="#10b981" />
  <circle cx="92" cy="94" r="3" fill="#ffffff" />

  <circle cx="30" cy="64" r="4.5" fill="#ef4444" />
</svg>
