<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cdp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cdp-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- High-contrast base for all browser tab backgrounds (dark/light mode) -->
  <rect width="32" height="32" rx="7.5" fill="#090d16" />
  
  <!-- Subtle neon rim border -->
  <rect x="1" y="1" width="30" height="30" rx="6.5" fill="none" stroke="url(#cdp-bg)" stroke-width="1.8" />
  
  <!-- Stylized "C" connectivity arc (Data Pack Loop) -->
  <path d="M22.5 8H12C9.5 8 7.5 10 7.5 12.5V19.5C7.5 22 9.5 24 12 24H22.5" 
        fill="none" 
        stroke="url(#cdp-bg)" 
        stroke-width="2.6" 
        stroke-linecap="round" />

  <!-- High-Speed Lightning Data Beam -->
  <path d="M18.5 5.5L10 16.5H16L13.5 26.5L23.5 14.5H17.5L20 5.5H18.5Z" 
        fill="url(#cdp-bolt)" />

  <!-- Tri-color Ghana Connectivity Accent Nodes -->
  <circle cx="23.5" cy="8.5" r="1.6" fill="#f59e0b" />
  <circle cx="23.5" cy="23.5" r="1.6" fill="#10b981" />
  <circle cx="8" cy="16" r="1.3" fill="#38bdf8" />
</svg>
